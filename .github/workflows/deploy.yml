name: Build & Deploy to SiteGround

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - sanity-publish
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Diagnose Sanity data
        run: |
          node -e "
          fetch('https://8g3u06mk.api.sanity.io/v2026-05-30/data/query/production?query=*%5B_type%3D%3D%22blogsPage%22%5D%5B0%5D%7Bseo%7Btitle%2Cdescription%7D%7D')
            .then(r=>r.json())
            .then(d=>console.log('[SANITY DIAG]', JSON.stringify(d.result)))
            .catch(e=>console.error('[SANITY DIAG ERROR]', e.message));
          "

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}

      - name: Create deployment probe
        run: echo "deploy-$(date -u +%Y%m%dT%H%M%SZ)" > ./out/probe.txt

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verify deployment reached web root
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sparklinemarketingfirm.com/probe.txt)
          CONTENT=$(curl -s https://sparklinemarketingfirm.com/probe.txt 2>/dev/null || echo "")
          echo "HTTP status: $STATUS"
          echo "Content: $CONTENT"
          if [ "$STATUS" = "200" ] && echo "$CONTENT" | grep -q "deploy-"; then
            echo "✅ FTP deployment reached the live web root"
          else
            echo "❌ FTP deployment did NOT reach the live web root (HTTP $STATUS)"
            echo "   Check that FTP_SERVER and FTP_REMOTE_DIR point to the correct SiteGround server and path"
          fi
